<section id="training">
  <div class="mx-auto max-w-6xl px-5 py-20 md:px-8 md:py-28">
    <header data-reveal class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
      <h2 class="font-display text-4xl font-extrabold tracking-[-0.02em] md:text-6xl">Work with me</h2>
      <p class="max-w-md text-slate">Software and training. I take on both.</p>
    </header>
    <ul class="mt-12 grid gap-px overflow-hidden rounded-3xl border border-line bg-line md:grid-cols-3">
      <li *ngFor="let service of services" data-reveal class="bg-paper p-6 md:p-8">
        <h3 class="font-display text-2xl font-bold tracking-tight">{{ service.title }}</h3>
        <p class="mt-3 leading-relaxed text-slate">{{ service.text }}</p>
      </li>
    </ul>
  </div>
</section>
