<section id="contact" class="bg-plate text-white">
  <div class="mx-auto max-w-6xl px-5 py-20 md:px-8 md:py-28">
    <p data-reveal class="font-mono text-xs uppercase tracking-[0.14em] text-white/70">Contact</p>
    <h2 data-reveal class="mt-4 font-display text-5xl font-extrabold tracking-[-0.03em] md:text-8xl">Let's talk.</h2>
    <a data-reveal href="mailto:taselablessed@gmail.com"
      class="mt-8 inline-block break-all font-display text-2xl font-bold underline decoration-plate-yellow decoration-4 underline-offset-8 hover:decoration-white md:text-4xl">
      taselablessed@gmail.com
    </a>
    <ul data-reveal class="mt-14 grid grid-cols-2 gap-4 md:grid-cols-4">
      <li *ngFor="let social of socials">
        <a [href]="social.url" target="_blank" rel="noopener noreferrer"
          class="flex items-center gap-3 rounded-2xl border border-white/25 p-4 transition-colors hover:bg-white hover:text-plate">
          <i-feather [name]="social.icon" class="h-5 w-5 shrink-0"></i-feather>
          <span class="min-w-0">
            <span class="block font-semibold">{{ social.label }}</span>
            <span class="block truncate font-mono text-xs opacity-75">{{ social.handle }}</span>
          </span>
        </a>
      </li>
    </ul>
  </div>
</section>
