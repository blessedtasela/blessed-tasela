<header class="fixed inset-x-0 top-0 z-50 border-b border-line bg-chalk/90 backdrop-blur">
  <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5 md:px-8" aria-label="Main">
    <a href="#top" (click)="go('top', $event)" class="flex items-center gap-3">
      <img class="h-9 w-9 rounded-full object-cover" src="assets/blessed-5.jpeg" alt="" />
      <span class="font-display text-lg font-bold tracking-tight">Blessed Tasela</span>
    </a>

    <ul class="hidden items-center gap-1 lg:flex">
      <li *ngFor="let link of links">
        <a [href]="'#' + link.id" (click)="go(link.id, $event)"
          class="rounded-full px-3 py-2 text-sm font-medium text-slate transition-colors hover:text-ink">
          {{ link.label }}
        </a>
      </li>
    </ul>

    <div class="flex items-center gap-2">
      <a [href]="cvPath" download="Blessed-Tasela-CV.pdf"
        class="hidden rounded-full bg-ink px-4 py-2 text-sm font-semibold text-chalk transition-colors hover:bg-plate sm:inline-flex">
        Download CV
      </a>
      <button type="button" class="rounded-full p-2 lg:hidden" (click)="setMenu(true)"
        aria-label="Open menu" [attr.aria-expanded]="menuOpen">
        <i-feather name="menu" class="h-6 w-6"></i-feather>
      </button>
    </div>
  </nav>

</header>

<!-- Mobile menu -->
<div *ngIf="menuOpen" class="fixed inset-0 z-50 flex flex-col bg-chalk lg:hidden" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="flex h-16 items-center justify-between border-b border-line px-5">
    <span class="font-display text-lg font-bold tracking-tight">Blessed Tasela</span>
    <button type="button" class="rounded-full p-2" (click)="setMenu(false)" aria-label="Close menu">
      <i-feather name="x" class="h-6 w-6"></i-feather>
    </button>
  </div>
  <ul class="flex flex-1 flex-col gap-2 px-5 pt-8">
    <li *ngFor="let link of links">
      <a [href]="'#' + link.id" (click)="go(link.id, $event)"
        class="block border-b border-line py-4 font-display text-3xl font-bold tracking-tight">
        {{ link.label }}
      </a>
    </li>
  </ul>
  <div class="px-5 pb-10">
    <a [href]="cvPath" download="Blessed-Tasela-CV.pdf" class="btn-primary w-full">Download CV</a>
  </div>
</div>
