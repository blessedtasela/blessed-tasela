<section id="top" class="mx-auto max-w-6xl px-5 pb-16 pt-28 md:px-8 md:pb-24 md:pt-36">
  <p class="eyebrow rise">Vancouver, BC · Software engineer · Personal trainer</p>

  <h1 class="rise mt-5 font-display text-[3.25rem] font-extrabold leading-[0.95] tracking-[-0.03em] sm:text-7xl md:text-8xl"
    style="animation-delay: 80ms">
    Blessed Tasela
  </h1>

  <p class="rise mt-6 max-w-3xl font-display text-2xl font-medium leading-snug tracking-tight text-ink md:text-4xl"
    style="animation-delay: 160ms">
    Software engineer and personal trainer, building
    <span class="mark">applied machine learning</span> into real products.
  </p>

  <div class="rise mt-10 flex flex-col gap-3 sm:flex-row sm:items-center" style="animation-delay: 240ms">
    <a [href]="cvPath" download="Blessed-Tasela-CV.pdf" class="btn-primary">Download CV</a>
    <a href="#work" (click)="scrollTo('work', $event)" class="btn-outline">See my work</a>
    <a href="mailto:taselablessed@gmail.com"
      class="px-2 py-3 text-center font-medium text-slate underline decoration-line underline-offset-4 hover:text-ink sm:text-left">
      taselablessed@gmail.com
    </a>
  </div>

  <!-- Signature: the route, as a timeline -->
  <ol class="rise relative mt-16 grid gap-8 border-l-2 border-ink pl-6 md:mt-24 md:grid-cols-4 md:gap-6 md:border-l-0 md:border-t-2 md:pl-0 md:pt-8"
    style="animation-delay: 320ms" aria-label="Route so far">
    <li *ngFor="let stop of route" class="relative">
      <span class="absolute -left-[33px] top-1 h-4 w-4 rounded-full border-2 border-ink md:-top-[41px] md:left-0"
        [ngClass]="stop.upcoming ? 'bg-chalk border-dashed' : 'bg-plate-yellow'"></span>
      <p class="font-mono text-xs uppercase tracking-[0.14em]" [ngClass]="stop.upcoming ? 'text-plate' : 'text-slate'">
        {{ stop.when }}
      </p>
      <p class="mt-1 font-display text-xl font-bold tracking-tight">{{ stop.place }}</p>
      <p class="mt-1 text-sm leading-relaxed text-slate">{{ stop.detail }}</p>
    </li>
  </ol>
</section>
